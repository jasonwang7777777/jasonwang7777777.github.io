<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>健康指标计算器 - 吃着瘦</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
            padding: 20px;
            background: linear-gradient(135deg, #f8f3eb 0%, #f0e6d6 100%);
            color: #5a4a42;
            line-height: 1.6;
            min-height: 100vh;
        }
        
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(139, 87, 42, 0.15);
            position: relative;
        }
        
        .logo {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 60px;
            height: 60px;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(139, 87, 42, 0.2);
        }
        
        .logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        h1 {
            text-align: center;
            color: #8B572A;
            margin-bottom: 10px;
            font-size: 22px;
            padding-right: 70px;
        }
        
        .subtitle {
            text-align: center;
            color: #8B572A;
            margin-bottom: 25px;
            opacity: 0.8;
            font-size: 14px;
            padding-right: 70px;
        }
        
        .input-group {
            margin-bottom: 20px;
        }
        
        .input-row {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
        }
        
        .input-item {
            flex: 1;
        }
        
        .gender-selection {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .gender-btn {
            flex: 1;
            padding: 12px;
            border: 2px solid #e6d5c3;
            border-radius: 8px;
            background: #fefaf5;
            color: #5a4a42;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
        }
        
        .gender-btn.active {
            background: #8B572A;
            color: white;
            border-color: #8B572A;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #8B572A;
            font-weight: 500;
            font-size: 14px;
        }
        
        .optional-label {
            color: #8B572A;
            opacity: 0.7;
        }
        
        input {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border: 2px solid #e6d5c3;
            border-radius: 8px;
            background-color: #fefaf5;
            color: #5a4a42;
            transition: all 0.3s;
        }
        
        input:focus {
            outline: none;
            border-color: #8B572A;
            box-shadow: 0 0 0 3px rgba(139, 87, 42, 0.1);
        }
        
        .calculate-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #8B572A 0%, #6d4220 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 25px;
        }
        
        .calculate-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(139, 87, 42, 0.3);
        }
        
        .result-section {
            display: none;
        }
        
        .indicators-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .indicators-grid.full {
            grid-template-columns: 1fr 1fr;
        }
        
        .indicator-card {
            background: #f9f1e7;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            border: 2px solid #e6d5c3;
        }
        
        .indicator-title {
            font-size: 14px;
            color: #8B572A;
            margin-bottom: 8px;
        }
        
        .indicator-value {
            font-size: 24px;
            font-weight: bold;
            color: #8B572A;
            margin-bottom: 5px;
        }
        
        .indicator-category {
            font-size: 14px;
            font-weight: bold;
        }
        
        /* 度量器样式 */
        .gauge-container {
            width: 100%;
            height: 25px;
            background: #f0f0f0;
            border-radius: 12px;
            margin: 15px 0;
            overflow: hidden;
            position: relative;
        }
        
        .gauge-fill {
            height: 100%;
            border-radius: 12px;
            transition: all 1s ease;
            width: 0%;
        }
        
        .gauge-marker {
            position: absolute;
            top: -5px;
            width: 3px;
            height: 35px;
            background: rgba(0,0,0,0.5);
            transform: translateX(-50%);
        }
        
        .gauge-labels {
            display: flex;
            justify-content: space-between;
            margin-top: 5px;
            font-size: 11px;
            color: #666;
        }
        
        .advice-section {
            background: #f9f1e7;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
            border-left: 4px solid #8B572A;
        }
        
        .advice-section h3 {
            color: #8B572A;
            margin-bottom: 12px;
            font-size: 16px;
        }
        
        .advice-list {
            list-style: none;
            padding-left: 0;
        }
        
        .advice-list li {
            margin-bottom: 8px;
            padding-left: 18px;
            position: relative;
            font-size: 14px;
        }
        
        .advice-list li:before {
            content: "•";
            color: #8B572A;
            position: absolute;
            left: 0;
            font-size: 16px;
        }
        
        .button-row {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }
        
        .reset-btn {
            flex: 1;
            padding: 14px;
            background: transparent;
            color: #8B572A;
            border: 2px solid #8B572A;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .reset-btn:hover {
            background: #8B572A;
            color: white;
        }
        
        .contact-btn {
            flex: 1;
            padding: 14px;
            background: #8B572A;
            color: white;
            border: 2px solid #8B572A;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            text-align: center;
            font-weight: bold;
        }
        
        .contact-btn:hover {
            background: #6d4220;
            border-color: #6d4220;
            transform: translateY(-2px);
            box-shadow: 0 3px 10px rgba(139, 87, 42, 0.3);
        }
        
        .risk-assessment {
            background: #fff9f0;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            border: 1px solid #ffd8a6;
        }
        
        .risk-title {
            color: #e67e22;
            font-weight: bold;
            margin-bottom: 8px;
            font-size: 14px;
        }
        
        .risk-content {
            font-size: 13px;
            color: #5a4a42;
        }
        
        .program-recommendation {
            background: linear-gradient(135deg, #8B572A 0%, #6d4220 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            text-align: left;
        }
        
        .program-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
            text-align: center;
        }
        
        .program-desc {
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 0;
        }
        
        .modal-content {
            max-height: 80vh;
            overflow-y: auto;
        }
        
        .optional-note {
            font-size: 12px;
            color: #8B572A;
            opacity: 0.7;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Logo区域 -->
        <div class="logo">
            <img src="logo.jpg" alt="吃着瘦Logo" onerror="this.style.display='none'">
        </div>
        
        <h1>健康指标计算器</h1>
        <div class="subtitle">全面评估您的健康状况</div>
        
        <div class="input-group">
            <!-- 性别选择 -->
            <div class="gender-selection">
                <div class="gender-btn" onclick="selectGender('male')" id="maleBtn">男性</div>
                <div class="gender-btn" onclick="selectGender('female')" id="femaleBtn">女性</div>
            </div>
            
            <div class="input-row">
                <div class="input-item">
                    <label for="height">身高 (cm) *</label>
                    <input type="number" id="height" placeholder="请输入身高" min="100" max="250">
                </div>
                <div class="input-item">
                    <label for="weight">体重 (kg) *</label>
                    <input type="number" id="weight" placeholder="请输入体重" min="20" max="200">
                </div>
            </div>
            <div class="input-row">
                <div class="input-item">
                    <label for="waist" class="optional-label">腰围 (cm)</label>
                    <input type="number" id="waist" placeholder="选填腰围" min="50" max="150">
                    <div class="optional-note">选填，填写后可计算腰臀比</div>
                </div>
                <div class="input-item">
                    <label for="hip" class="optional-label">臀围 (cm)</label>
                    <input type="number" id="hip" placeholder="选填臀围" min="60" max="200">
                    <div class="optional-note">选填，填写后可计算腰臀比</div>
                </div>
            </div>
        </div>
        
        <button class="calculate-btn" onclick="calculateHealthIndicators()">计算健康指标</button>
        
        <div class="result-section" id="resultSection">
            <div class="indicators-grid" id="indicatorsGrid">
                <div class="indicator-card">
                    <div class="indicator-title">BMI指数</div>
                    <div class="indicator-value" id="bmiValue">--</div>
                    <div class="indicator-category" id="bmiCategory">--</div>
                </div>
                <!-- 腰臀比卡片将通过JavaScript动态添加 -->
            </div>
            
            <div>
                <div class="indicator-title">BMI指标</div>
                <div class="gauge-container">
                    <div class="gauge-fill" id="bmiGaugeFill"></div>
                    <div class="gauge-marker" id="bmiGaugeMarker"></div>
                </div>
                <div class="gauge-labels">
                    <span>偏瘦</span>
                    <span>正常</span>
                    <span>超重</span>
                    <span>肥胖</span>
                </div>
            </div>
            
            <!-- 腰臀比指标区域将通过JavaScript动态添加 -->
            <div id="whrSection"></div>
            
            <div class="risk-assessment" id="riskAssessment">
                <div class="risk-title">健康风险评估</div>
                <div class="risk-content" id="riskContent">--</div>
            </div>
            
            <div class="advice-section">
                <h3>健康建议</h3>
                <ul class="advice-list" id="adviceList">
                    <!-- 建议内容将通过JavaScript动态生成 -->
                </ul>
            </div>
            
            <!-- 吃着瘦方案推荐 - 移动到健康建议下面 -->
            <div class="program-recommendation" id="programRecommendation" style="display: none;">
                <div class="program-title">💫 专属减重方案推荐</div>
                <div class="program-desc" id="programDesc"></div>
            </div>
            
            <div class="button-row">
                <button class="reset-btn" onclick="resetCalculator()">重新计算</button>
                <button class="contact-btn" onclick="contactUs()">联系我们</button>
            </div>
        </div>
    </div>

    <script>
        let selectedGender = '';
        let currentWeight = 0;
        let hasWHRData = false;
        
        function selectGender(gender) {
            selectedGender = gender;
            document.getElementById('maleBtn').classList.remove('active');
            document.getElementById('femaleBtn').classList.remove('active');
            document.getElementById(gender + 'Btn').classList.add('active');
        }
        
        function calculateHealthIndicators() {
            const height = parseFloat(document.getElementById('height').value);
            const weight = parseFloat(document.getElementById('weight').value);
            const waist = parseFloat(document.getElementById('waist').value);
            const hip = parseFloat(document.getElementById('hip').value);
            
            currentWeight = weight;
            
            // 验证必填输入
            if (!selectedGender) {
                alert('请选择性别');
                return;
            }
            
            if (!height || !weight || height < 100 || height > 250 || weight < 20 || weight > 200) {
                alert('请输入有效的身高（100-250cm）和体重（20-200kg）数值');
                return;
            }
            
            // 检查是否有腰臀比数据
            hasWHRData = waist && hip && waist >= 50 && waist <= 150 && hip >= 60 && hip <= 200;
            
            // 计算BMI
            const heightInMeter = height / 100;
            const bmi = weight / (heightInMeter * heightInMeter);
            const roundedBMI = bmi.toFixed(1);
            
            // 显示结果
            document.getElementById('bmiValue').textContent = roundedBMI;
            
            // 确定BMI分类
            let bmiCategory, bmiColor, bmiRisk, needWeightLoss;
            if (bmi < 18.5) {
                bmiCategory = '体重偏轻';
                bmiColor = '#e74c3c';
                bmiRisk = '低';
                needWeightLoss = false;
            } else if (bmi < 24) {
                bmiCategory = '体重正常';
                bmiColor = '#2ecc71';
                bmiRisk = '低';
                needWeightLoss = false;
            } else if (bmi < 28) {
                bmiCategory = '超重';
                bmiColor = '#f39c12';
                bmiRisk = '中';
                needWeightLoss = true;
            } else {
                bmiCategory = '肥胖';
                bmiColor = '#e74c3c';
                bmiRisk = '高';
                needWeightLoss = true;
            }
            
            document.getElementById('bmiCategory').textContent = bmiCategory;
            document.getElementById('bmiCategory').style.color = bmiColor;
            
            // 更新度量器
            updateBMIGauge(bmi);
            
            // 如果有腰臀比数据，计算并显示
            if (hasWHRData) {
                calculateAndDisplayWHR(waist, hip);
                // 设置双列布局
                document.getElementById('indicatorsGrid').classList.add('full');
            } else {
                // 设置单列布局
                document.getElementById('indicatorsGrid').classList.remove('full');
                // 清除腰臀比区域
                document.getElementById('whrSection').innerHTML = '';
            }
            
            // 生成综合建议和风险评估
            const advice = generateAdvice(bmi, hasWHRData, bmiRisk, selectedGender, needWeightLoss);
            updateAdvice(advice);
            
            // 显示风险评估
            updateRiskAssessment(bmiRisk, hasWHRData);
            
            // 显示吃着瘦方案推荐（如果需要减重）
            if (needWeightLoss) {
                showProgramRecommendation(weight);
            } else {
                document.getElementById('programRecommendation').style.display = 'none';
            }
            
            // 显示结果区域
            document.getElementById('resultSection').style.display = 'block';
        }
        
        function calculateAndDisplayWHR(waist, hip) {
            // 计算腰臀比
            const whr = waist / hip;
            const roundedWHR = whr.toFixed(2);
            
            // 确定腰臀比分类（基于WHO标准，区分男女）
            let whrCategory, whrColor, whrRisk;
            
            if (selectedGender === 'male') {
                // 男性标准
                if (whr < 0.95) {
                    whrCategory = '低风险';
                    whrColor = '#2ecc71';
                    whrRisk = '低';
                } else if (whr < 1.0) {
                    whrCategory = '中等风险';
                    whrColor = '#f39c12';
                    whrRisk = '中';
                } else {
                    whrCategory = '高风险';
                    whrColor = '#e74c3c';
                    whrRisk = '高';
                }
            } else {
                // 女性标准
                if (whr < 0.85) {
                    whrCategory = '低风险';
                    whrColor = '#2ecc71';
                    whrRisk = '低';
                } else if (whr < 0.90) {
                    whrCategory = '中等风险';
                    whrColor = '#f39c12';
                    whrRisk = '中';
                } else {
                    whrCategory = '高风险';
                    whrColor = '#e74c3c';
                    whrRisk = '高';
                }
            }
            
            // 添加腰臀比卡片到指标网格
            const indicatorsGrid = document.getElementById('indicatorsGrid');
            if (!document.getElementById('whrCard')) {
                const whrCard = document.createElement('div');
                whrCard.className = 'indicator-card';
                whrCard.id = 'whrCard';
                whrCard.innerHTML = `
                    <div class="indicator-title">腰臀比</div>
                    <div class="indicator-value" id="whrValue">${roundedWHR}</div>
                    <div class="indicator-category" id="whrCategory">${whrCategory}</div>
                `;
                indicatorsGrid.appendChild(whrCard);
            } else {
                document.getElementById('whrValue').textContent = roundedWHR;
                document.getElementById('whrCategory').textContent = whrCategory;
            }
            document.getElementById('whrCategory').style.color = whrColor;
            
            // 添加腰臀比度量器区域
            const whrSection = document.getElementById('whrSection');
            whrSection.innerHTML = `
                <div>
                    <div class="indicator-title">腰臀比指标</div>
                    <div class="gauge-container">
                        <div class="gauge-fill" id="whrGaugeFill"></div>
                        <div class="gauge-marker" id="whrGaugeMarker"></div>
                    </div>
                    <div class="gauge-labels">
                        <span>低风险</span>
                        <span>中等风险</span>
                        <span>高风险</span>
                    </div>
                </div>
            `;
            
            // 更新腰臀比度量器
            updateWHRGauge(whr);
        }
        
        function showProgramRecommendation(weight) {
            // 计算目标体重范围（5%-10%减重）
            const minTargetWeight = (weight * 0.90).toFixed(1);
            const maxTargetWeight = (weight * 0.95).toFixed(1);
            
            const programDesc = `我们的"吃着瘦"方案，在不运动不节食的情况下，40天由营养师一对一带领您优化饮食和调整代谢。可让您目前的体重由${weight}公斤降低到${minTargetWeight}-${maxTargetWeight}公斤。而且通过这种方式是绝对健康的不会反弹。在下面联系我们按钮可以详细沟通。`;
            
            document.getElementById('programDesc').textContent = programDesc;
            document.getElementById('programRecommendation').style.display = 'block';
        }
        
        function updateBMIGauge(bmi) {
            const gaugeFill = document.getElementById('bmiGaugeFill');
            const gaugeMarker = document.getElementById('bmiGaugeMarker');
            
            // BMI范围：15-40，对应0-100%
            let percentage = ((bmi - 15) / (40 - 15)) * 100;
            percentage = Math.max(0, Math.min(100, percentage));
            
            gaugeFill.style.width = percentage + '%';
            gaugeMarker.style.left = percentage + '%';
            
            // 根据BMI值调整颜色
            if (bmi < 18.5) {
                gaugeFill.style.background = 'linear-gradient(90deg, #e74c3c 0%, #f1c40f 50%)';
            } else if (bmi < 24) {
                gaugeFill.style.background = 'linear-gradient(90deg, #2ecc71 0%, #f1c40f 100%)';
            } else if (bmi < 28) {
                gaugeFill.style.background = 'linear-gradient(90deg, #f1c40f 0%, #e67e22 100%)';
            } else {
                gaugeFill.style.background = 'linear-gradient(90deg, #e67e22 0%, #e74c3c 100%)';
            }
        }
        
        function updateWHRGauge(whr) {
            const gaugeFill = document.getElementById('whrGaugeFill');
            const gaugeMarker = document.getElementById('whrGaugeMarker');
            
            // 腰臀比范围：0.6-1.2，对应0-100%
            let percentage = ((whr - 0.6) / (1.2 - 0.6)) * 100;
            percentage = Math.max(0, Math.min(100, percentage));
            
            gaugeFill.style.width = percentage + '%';
            gaugeMarker.style.left = percentage + '%';
            
            // 根据腰臀比调整颜色
            if (selectedGender === 'male') {
                if (whr < 0.95) {
                    gaugeFill.style.background = 'linear-gradient(90deg, #2ecc71 0%, #f1c40f 50%)';
                } else if (whr < 1.0) {
                    gaugeFill.style.background = 'linear-gradient(90deg, #f1c40f 0%, #e67e22 100%)';
                } else {
                    gaugeFill.style.background = 'linear-gradient(90deg, #e67e22 0%, #e74c3c 100%)';
                }
            } else {
                if (whr < 0.85) {
                    gaugeFill.style.background = 'linear-gradient(90deg, #2ecc71 0%, #f1c40f 50%)';
                } else if (whr < 0.90) {
                    gaugeFill.style.background = 'linear-gradient(90deg, #f1c40f 0%, #e67e22 100%)';
                } else {
                    gaugeFill.style.background = 'linear-gradient(90deg, #e67e22 0%, #e74c3c 100%)';
                }
            }
        }
        
        function generateAdvice(bmi, hasWHRData, bmiRisk, gender, needWeightLoss) {
            const advice = [];
            const genderText = gender === 'male' ? '男性' : '女性';
            
            // BMI相关建议
            if (bmi < 18.5) {
                advice.push('建议适当增加营养摄入，保持均衡饮食');
                advice.push('可以适当增加优质蛋白质的摄入，如鸡蛋、牛奶、豆制品');
            } else if (bmi < 24) {
                advice.push('恭喜！您的体重在健康范围内，请继续保持');
                advice.push('维持均衡饮食和规律运动的好习惯');
            } else {
                advice.push('建议控制饮食，减少高热量食物摄入');
                advice.push('增加有氧运动，如快走、游泳、骑自行车等');
                advice.push('设定合理的减重目标（每周0.5-1kg）');
            }
            
            // 腰臀比相关建议（如果有数据）
            if (hasWHRData) {
                advice.push(`作为${genderText}，建议关注腰臀比指标，控制腹部脂肪`);
                advice.push('增加核心肌群训练，减少精制碳水化合物摄入');
            } else {
                advice.push('建议测量腰围和臀围，了解腰臀比指标');
                advice.push('腰臀比是评估健康风险的重要指标');
            }
            
            // 综合建议
            if (bmiRisk === '高') {
                advice.push('您的健康风险较高，建议咨询专业营养师制定个性化方案');
            }
            
            advice.push('定期监测体重变化，及时调整生活方式');
            advice.push('保持充足睡眠，减少压力，有助于体重管理');
            
            return advice;
        }
        
        function updateRiskAssessment(bmiRisk, hasWHRData) {
            const riskContent = document.getElementById('riskContent');
            let riskLevel = '低';
            let riskDescription = '';
            
            if (bmiRisk === '高') {
                riskLevel = '高';
                riskDescription = '您的心血管疾病和代谢疾病风险较高，建议尽快采取干预措施';
            } else if (bmiRisk === '中') {
                riskLevel = '中';
                riskDescription = '您存在一定的健康风险，建议改善生活方式以降低风险';
            } else {
                riskLevel = '低';
                riskDescription = '您的健康状况良好，继续保持健康的生活方式';
            }
            
            if (!hasWHRData) {
                riskDescription += '（建议补充腰臀比数据获得更全面评估）';
            }
            
            riskContent.textContent = `综合风险等级：${riskLevel}。${riskDescription}`;
        }
        
        function updateAdvice(adviceList) {
            const adviceElement = document.getElementById('adviceList');
            adviceElement.innerHTML = '';
            
            adviceList.forEach(advice => {
                const li = document.createElement('li');
                li.textContent = advice;
                adviceElement.appendChild(li);
            });
        }

        function resetCalculator() {
            selectedGender = '';
            hasWHRData = false;
            document.getElementById('maleBtn').classList.remove('active');
            document.getElementById('femaleBtn').classList.remove('active');
            document.getElementById('height').value = '';
            document.getElementById('weight').value = '';
            document.getElementById('waist').value = '';
            document.getElementById('hip').value = '';
            document.getElementById('resultSection').style.display = 'none';
            document.getElementById('indicatorsGrid').classList.remove('full');
            // 清除动态添加的腰臀比卡片
            const whrCard = document.getElementById('whrCard');
            if (whrCard) {

        // 支持按Enter键计算
        document.addEventListener('keypress', function(event) {

                calculateHealthIndicators();
            }
