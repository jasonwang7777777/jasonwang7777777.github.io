<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI计算器 - 吃着瘦</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
            padding: 20px;
            background: linear-gradient(135deg, #f8f3eb 0%, #f0e6d6 100%);
            color: #5a4a42;
            line-height: 1.6;
            min-height: 100vh;
        }
        
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(139, 87, 42, 0.15);
        }
        
        h1 {
            text-align: center;
            color: #8B572A;
            margin-bottom: 10px;
            font-size: 24px;
        }
        
        .subtitle {
            text-align: center;
            color: #8B572A;
            margin-bottom: 25px;
            opacity: 0.8;
            font-size: 14px;
        }
        
        .input-group {
            margin-bottom: 20px;
        }
        
        .input-row {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
        }
        
        .input-item {
            flex: 1;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #8B572A;
            font-weight: 500;
        }
        
        input {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            border: 2px solid #e6d5c3;
            border-radius: 10px;
            background-color: #fefaf5;
            color: #5a4a42;
            transition: all 0.3s;
        }
        
        input:focus {
            outline: none;
            border-color: #8B572A;
            box-shadow: 0 0 0 3px rgba(139, 87, 42, 0.1);
        }
        
        .calculate-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #8B572A 0%, #6d4220 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 25px;
        }
        
        .calculate-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(139, 87, 42, 0.3);
        }
        
        .result-section {
            display: none;
            text-align: center;
        }
        
        .bmi-value {
            font-size: 48px;
            font-weight: bold;
            color: #8B572A;
            margin: 15px 0;
        }
        
        .bmi-category {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 25px;
        }
        
        /* 度量器样式 */
        .gauge-container {
            width: 100%;
            height: 30px;
            background: #f0f0f0;
            border-radius: 15px;
            margin: 25px 0;
            overflow: hidden;
            position: relative;
        }
        
        .gauge-fill {
            height: 100%;
            border-radius: 15px;
            transition: all 1s ease;
            background: linear-gradient(90deg, 
                #2ecc71 0%, 
                #f1c40f 50%, 
                #e74c3c 100%);
            width: 0%;
        }
        
        .gauge-marker {
            position: absolute;
            top: -5px;
            width: 3px;
            height: 40px;
            background: rgba(0,0,0,0.5);
            transform: translateX(-50%);
        }
        
        .gauge-labels {
            display: flex;
            justify-content: space-between;
            margin-top: 8px;
            font-size: 12px;
            color: #666;
        }
        
        .advice-section {
            background: #f9f1e7;
            padding: 20px;
            border-radius: 10px;
            margin-top: 25px;
            border-left: 4px solid #8B572A;
        }
        
        .advice-section h3 {
            color: #8B572A;
            margin-bottom: 12px;
        }
        
        .advice-list {
            list-style: none;
            padding-left: 0;
        }
        
        .advice-list li {
            margin-bottom: 10px;
            padding-left: 20px;
            position: relative;
        }
        
        .advice-list li:before {
            content: "•";
            color: #8B572A;
            position: absolute;
            left: 0;
            font-size: 18px;
        }
        
        .reset-btn {
            width: 100%;
            padding: 14px;
            background: transparent;
            color: #8B572A;
            border: 2px solid #8B572A;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 20px;
        }
        
        .reset-btn:hover {
            background: #8B572A;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>BMI计算器</h1>
        <div class="subtitle">了解您的身体质量指数，开启健康生活</div>
        
        <div class="input-group">
            <div class="input-row">
                <div class="input-item">
                    <label for="height">身高 (cm)</label>
                    <input type="number" id="height" placeholder="请输入身高" min="100" max="250">
                </div>
                <div class="input-item">
                    <label for="weight">体重 (kg)</label>
                    <input type="number" id="weight" placeholder="请输入体重" min="20" max="200">
                </div>
            </div>
        </div>
        
        <button class="calculate-btn" onclick="calculateBMI()">计算BMI</button>
        
        <div class="result-section" id="resultSection">
            <div class="bmi-value" id="bmiValue">--</div>
            <div class="bmi-category" id="bmiCategory">--</div>
            
            <div class="gauge-container">
                <div class="gauge-fill" id="gaugeFill"></div>
                <div class="gauge-marker" id="gaugeMarker"></div>
            </div>
            <div class="gauge-labels">
                <span>偏瘦</span>
                <span>正常</span>
                <span>超重</span>
                <span>肥胖</span>
            </div>
            
            <div class="advice-section">
                <h3>健康建议</h3>
                <ul class="advice-list" id="adviceList">
                    <!-- 建议内容将通过JavaScript动态生成 -->
                </ul>
            </div>
            
            <button class="reset-btn" onclick="resetCalculator()">重新计算</button>
        </div>
    </div>

    <script>
        function calculateBMI() {
            const height = parseFloat(document.getElementById('height').value);
            const weight = parseFloat(document.getElementById('weight').value);
            
            if (!height || !weight || height < 100 || height > 250 || weight < 20 || weight > 200) {
                alert('请输入有效的身高（100-250cm）和体重（20-200kg）数值');
                return;
            }
            
            // 计算BMI
            const heightInMeter = height / 100;
            const bmi = weight / (heightInMeter * heightInMeter);
            const roundedBMI = bmi.toFixed(1);
            
            // 显示结果
            document.getElementById('bmiValue').textContent = roundedBMI;
            
            // 确定BMI分类和建议
            let category, color, advice;
            
            if (bmi < 18.5) {
                category = '体重偏轻';
                color = '#e74c3c';
                advice = [
                    '建议适当增加营养摄入，保持均衡饮食',
                    '可以适当增加优质蛋白质的摄入',
                    '结合适量力量训练，增加肌肉量',
                    '保持规律作息，避免过度劳累'
                ];
            } else if (bmi < 24) {
                category = '体重正常';
                color = '#2ecc71';
                advice = [
                    '恭喜！您的体重在健康范围内',
                    '继续保持均衡饮食和适量运动',
                    '定期监测体重变化',
                    '维持健康的生活方式'
                ];
            } else if (bmi < 28) {
                category = '超重';
                color = '#f39c12';
                advice = [
                    '建议适当控制饮食，减少高热量食物',
                    '增加有氧运动，如快走、游泳等',
                    '设定合理的减重目标（每周0.5-1kg）',
                    '注意饮食结构，多吃蔬菜水果'
                ];
            } else {
                category = '肥胖';
                color = '#e74c3c';
                advice = [
                    '建议咨询专业营养师制定减重计划',
                    '严格控制饮食，减少高糖高脂食物',
                    '增加运动量，建议每周150分钟中等强度运动',
                    '可以考虑参加专业的减重指导服务'
                ];
            }
            
            document.getElementById('bmiCategory').textContent = category;
            document.getElementById('bmiCategory').style.color = color;
            
            // 更新度量器
            updateGauge(bmi);
            
            // 更新建议
            updateAdvice(advice);
            
            // 显示结果区域
            document.getElementById('resultSection').style.display = 'block';
        }
        
        function updateGauge(bmi) {
            const gaugeFill = document.getElementById('gaugeFill');
            const gaugeMarker = document.getElementById('gaugeMarker');
            
            // BMI范围：15-40，对应0-100%
            let percentage = ((bmi - 15) / (40 - 15)) * 100;
            percentage = Math.max(0, Math.min(100, percentage)); // 限制在0-100%
            
            gaugeFill.style.width = percentage + '%';
            gaugeMarker.style.left = percentage + '%';
            
            // 根据BMI值调整颜色
            if (bmi < 18.5) {
                gaugeFill.style.background = 'linear-gradient(90deg, #e74c3c 0%, #f1c40f 100%)';
            } else if (bmi < 24) {
                gaugeFill.style.background = 'linear-gradient(90deg, #2ecc71 0%, #f1c40f 100%)';
            } else if (bmi < 28) {
                gaugeFill.style.background = 'linear-gradient(90deg, #f1c40f 0%, #e67e22 100%)';
            } else {
                gaugeFill.style.background = 'linear-gradient(90deg, #e67e22 0%, #e74c3c 100%)';
            }
        }
        
        function updateAdvice(adviceList) {
            const adviceElement = document.getElementById('adviceList');
            adviceElement.innerHTML = '';
            
            adviceList.forEach(advice => {
                const li = document.createElement('li');
                li.textContent = advice;
                adviceElement.appendChild(li);
            });
        }
        
        function resetCalculator() {
            document.getElementById('height').value = '';
            document.getElementById('weight').value = '';
            document.getElementById('resultSection').style.display = 'none';
        }
        
        // 支持按Enter键计算
        document.addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                calculateBMI();
            }
        });
    </script>
</body>
</html>
